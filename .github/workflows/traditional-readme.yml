name: Traditional Chinese README

on:
  push:
    branches:
      - main
    paths:
      - '.github/traditional-readme-request'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCC
        run: python3 -m pip install --quiet opencc-python-reimplemented

      - name: Convert README
        run: python3 scripts/convert_readme_traditional.py

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '讓高能力模型負責思考與決策' README.zh-CN.md
          grep -q '模型名稱、方案與可用額度可能隨 OpenAI 產品調整' README.zh-CN.md
          grep -q '\[繁體中文\](README.zh-CN.md)' README.md

      - name: Commit README update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.zh-CN.md README.md
          git commit -m "docs: rewrite Chinese README in Traditional Chinese"
          git push origin HEAD:main
