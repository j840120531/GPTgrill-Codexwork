name: Rename Traditional Chinese README

on:
  push:
    branches:
      - main
    paths:
      - '.github/rename-readme-zh-tw-request'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename README and fix wording
        shell: bash
        run: |
          set -euo pipefail
          git mv README.zh-CN.md README.zh-TW.md
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('README.zh-TW.md')
          t = p.read_text(encoding='utf-8').replace('覆制', '複製')
          p.write_text(t, encoding='utf-8')

          p = Path('README.md')
          t = p.read_text(encoding='utf-8').replace('[繁體中文](README.zh-CN.md)', '[繁體中文](README.zh-TW.md)')
          p.write_text(t, encoding='utf-8')

          p = Path('package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['files'] = ['README.zh-TW.md' if x == 'README.zh-CN.md' else x for x in data.get('files', [])]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-TW.md package.json
          git commit -m "docs: rename Traditional Chinese README to zh-TW"
          git push origin HEAD:main
