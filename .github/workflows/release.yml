name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Resolve version
        id: version
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "Tag version ${TAG_VERSION} does not match package.json version ${PKG_VERSION}." >&2
              exit 1
            fi
          fi
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf release-assets
          mkdir -p release-assets

          # ChatGPT Web Skills. Keep the skill directory itself as the ZIP root.
          (cd skills && zip -qr "../release-assets/grill-me-web-skill-v${VERSION}.zip" grill-me)
          (cd skills && zip -qr "../release-assets/goal-loop-web-skill-v${VERSION}.zip" goal-loop)

          # Local Goal Loop Runner as a normal npm-installable tarball.
          PACK_FILE="$(npm pack --pack-destination release-assets --silent | tail -n 1)"
          mv "release-assets/${PACK_FILE}" "release-assets/goal-loop-local-v${VERSION}.tgz"

          # Portable source bundle for users who prefer clone/unzip + npm link.
          git archive \
            --format=zip \
            --prefix="goal-loop-v${VERSION}/" \
            -o "release-assets/goal-loop-local-v${VERSION}.zip" \
            HEAD \
            src package.json package-lock.json README.md README.zh-CN.md LICENSE \
            INSTALL_FOR_CODEX.md docs examples skills

          (
            cd release-assets
            shasum -a 256 \
              grill-me-web-skill-v${VERSION}.zip \
              goal-loop-web-skill-v${VERSION}.zip \
              goal-loop-local-v${VERSION}.tgz \
              goal-loop-local-v${VERSION}.zip \
              > SHA256SUMS.txt
          )

          ls -lh release-assets

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: goal-loop-release-v${{ steps.version.outputs.version }}
          path: release-assets/

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/grill-me-web-skill-v${{ steps.version.outputs.version }}.zip
            release-assets/goal-loop-web-skill-v${{ steps.version.outputs.version }}.zip
            release-assets/goal-loop-local-v${{ steps.version.outputs.version }}.tgz
            release-assets/goal-loop-local-v${{ steps.version.outputs.version }}.zip
            release-assets/SHA256SUMS.txt
