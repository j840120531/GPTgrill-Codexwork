name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/release-request'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.3.0 or v0.3.0. Must match package.json.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve and validate release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"

          if [[ "${PKG_VERSION}" != "${LOCK_VERSION}" ]]; then
            echo "package.json version ${PKG_VERSION} does not match package-lock.json version ${LOCK_VERSION}." >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
          else
            REQUEST_VERSION="$(tr -d '[:space:]' < .github/release-request)"
            VERSION="${REQUEST_VERSION#v}"
            TAG="v${VERSION}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag/version: ${TAG}" >&2
            exit 1
          fi

          if [[ "${VERSION}" != "${PKG_VERSION}" ]]; then
            echo "Requested/tag version ${VERSION} does not match package.json version ${PKG_VERSION}." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Guard release request
        if: github.ref_type != 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch origin main --tags
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"

          if [[ "${HEAD_SHA}" != "${MAIN_SHA}" ]]; then
            echo "Release requests must be created from the current main HEAD." >&2
            echo "HEAD=${HEAD_SHA}" >&2
            echo "origin/main=${MAIN_SHA}" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Refusing to overwrite it." >&2
            exit 1
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Refusing to overwrite it." >&2
            exit 1
          fi

      - name: Guard tag-triggered release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Refusing to overwrite it." >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf release-assets
          mkdir -p release-assets

          (cd skills && zip -qr "../release-assets/grill-me-web-skill-v${VERSION}.zip" grill-me)
          (cd skills && zip -qr "../release-assets/gptgrill-codexwork-web-skill-v${VERSION}.zip" gptgrill-codexwork)

          PACK_FILE="$(npm pack --pack-destination release-assets --silent | tail -n 1)"
          mv "release-assets/${PACK_FILE}" "release-assets/gptgrill-codexwork-local-v${VERSION}.tgz"

          git archive \
            --format=zip \
            --prefix="GPTgrill-Codexwork-v${VERSION}/" \
            -o "release-assets/gptgrill-codexwork-local-v${VERSION}.zip" \
            HEAD \
            src test package.json package-lock.json README.md README.zh-TW.md LICENSE \
            INSTALL_FOR_CODEX.md docs examples skills

          (
            cd release-assets
            shasum -a 256 \
              grill-me-web-skill-v${VERSION}.zip \
              gptgrill-codexwork-web-skill-v${VERSION}.zip \
              gptgrill-codexwork-local-v${VERSION}.tgz \
              gptgrill-codexwork-local-v${VERSION}.zip \
              > SHA256SUMS.txt
          )

          ls -lh release-assets

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gptgrill-codexwork-release-v${{ steps.version.outputs.version }}
          path: release-assets/

      - name: Create release tag
        if: github.ref_type != 'tag'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "GPTgrill-Codexwork ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GPTgrill-Codexwork ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/grill-me-web-skill-v${{ steps.version.outputs.version }}.zip
            release-assets/gptgrill-codexwork-web-skill-v${{ steps.version.outputs.version }}.zip
            release-assets/gptgrill-codexwork-local-v${{ steps.version.outputs.version }}.tgz
            release-assets/gptgrill-codexwork-local-v${{ steps.version.outputs.version }}.zip
            release-assets/SHA256SUMS.txt
